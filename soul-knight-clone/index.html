<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元气地牢 - Soul Dungeon</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
  font-family: 'Courier New', monospace;
}
canvas { border: 2px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════════════════
const W = 960, H = 640;
const TILE = 40;
const FPS = 60;

const COLORS = {
  BLACK: '#000000', WHITE: '#ffffff', GRAY: '#808080',
  DARK_GRAY: '#282828', RED: '#dc3232', GREEN: '#32dc32',
  BLUE: '#3264dc', YELLOW: '#dcdc32', ORANGE: '#f08c1e',
  PURPLE: '#a032dc', CYAN: '#32c8c8', BROWN: '#8b5a2b',
  DARK_BROWN: '#503214', LIGHT_BROWN: '#b48250',
};

// ── Player ──────────────────────────────────────────────────
const PLAYER_SPEED = 200, PLAYER_SIZE = 18;
const PLAYER_MAX_HP = 6, PLAYER_MAX_SHIELD = 6;
const PLAYER_SHIELD_REGEN = 0.5, PLAYER_SHIELD_REGEN_DELAY = 3.0;
const PLAYER_MAX_ENERGY = 100, PLAYER_ENERGY_REGEN = 10;

// ── Weapons ─────────────────────────────────────────────────
const WEAPON_DATA = {
  pistol:  { name:'手枪', dmg:3, rate:0.40, mag:12, reload:1.2, bspeed:500, spread:0.05, eCost:0, type:'proj', color:'#dcdc32', pellets:1 },
  rifle:   { name:'步枪', dmg:2, rate:0.15, mag:25, reload:1.5, bspeed:600, spread:0.08, eCost:0, type:'proj', color:'#f08c1e', pellets:1 },
  shotgun: { name:'霰弹枪', dmg:2, rate:0.70, mag:6, reload:1.8, bspeed:450, spread:0.30, eCost:0, type:'shotgun', color:'#dc3232', pellets:5 },
  laser:   { name:'激光枪', dmg:4, rate:0.10, mag:Infinity, reload:0, bspeed:800, spread:0.0, eCost:4, type:'laser', color:'#32c8c8', pellets:1 },
  sword:   { name:'光剑', dmg:5, rate:0.50, mag:Infinity, reload:0, bspeed:0, spread:0, eCost:0, type:'melee', color:'#a032dc', range:50 },
};

// ── Enemies ─────────────────────────────────────────────────
const ENEMY_DATA = {
  slime:    { name:'史莱姆', hp:8, speed:80, dmg:2, size:14, color:'#64dc50', behavior:'chase', atkRange:0, atkCD:0, projSpeed:0, score:10 },
  skeleton: { name:'骷髅射手', hp:10, speed:60, dmg:1, size:16, color:'#c8c8be', behavior:'keep_distance', atkRange:300, atkCD:1.5, projSpeed:300, score:15, prefDist:200 },
  bat:      { name:'蝙蝠', hp:5, speed:140, dmg:1, size:11, color:'#a03cc8', behavior:'erratic', atkRange:0, atkCD:0, projSpeed:0, score:8 },
};

const BOSS_DATA = {
  name:'暗黑骑士', hp:80, speed:100, dmg:3, size:34, color:'#b42828', score:200,
};

// ── Dungeon ─────────────────────────────────────────────────
const DUNGEON_SIZE = 7, MIN_ROOMS = 8, MAX_ROOMS = 14;
const ROOM_W = 800, ROOM_H = 560;

// ═══════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════
function dist(a, b) { return Math.hypot(a[0]-b[0], a[1]-b[1]); }
function angleTo(a, b) { return Math.atan2(b[1]-a[1], b[0]-a[0]); }
function vecFromAngle(a, speed) { return [Math.cos(a)*speed, Math.sin(a)*speed]; }
function norm(x, y) { const m = Math.hypot(x,y); return m ? [x/m, y/m] : [0,0]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function randRange(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(randRange(a, b + 1)); }
function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ═══════════════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('game');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');

// ═══════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════
const keys = {};
const mouse = { x: 0, y: 0, left: false, right: false };
let mouseWorld = { x: 0, y: 0 };

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });
canvas.addEventListener('mousemove', e => { mouse.x = e.offsetX; mouse.y = e.offsetY; });
canvas.addEventListener('mousedown', e => { if(e.button===0) mouse.left=true; if(e.button===2) mouse.right=true; e.preventDefault(); });
canvas.addEventListener('mouseup', e => { if(e.button===0) mouse.left=false; if(e.button===2) mouse.right=false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function consumeKey(key) {
  if (keys[key]) { keys[key] = false; return true; }
  return false;
}

// ═══════════════════════════════════════════════════════════════
// SPRITES (drawn to offscreen canvases)
// ═══════════════════════════════════════════════════════════════
const spriteCache = {};

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function drawSprite(key, fn, ...args) {
  const ck = key + (args.length ? JSON.stringify(args) : '');
  if (spriteCache[ck]) return spriteCache[ck];
  const c = makeCanvas(32, 32);
  const cx = c.getContext('2d');
  fn(cx, ...args);
  spriteCache[ck] = c;
  return c;
}

function makePlayerSprite(cx) {
  // Body
  cx.fillStyle = '#2850c8'; cx.fillRect(10, 12, 12, 10);
  // Head
  cx.fillStyle = '#ffd296'; cx.fillRect(11, 4, 10, 9);
  // Helmet
  cx.fillStyle = '#3c3c3c'; cx.fillRect(10, 4, 12, 4);
  cx.fillStyle = '#64b4ff'; cx.fillRect(12, 5, 8, 2);
  // Legs
  cx.fillStyle = '#1e3296'; cx.fillRect(11, 22, 4, 6);
  cx.fillStyle = '#1e3296'; cx.fillRect(17, 22, 4, 6);
  // Arms
  cx.fillStyle = '#2850c8'; cx.fillRect(5, 14, 5, 6);
  cx.fillStyle = '#2850c8'; cx.fillRect(22, 14, 5, 6);
  // Belt
  cx.fillStyle = '#785028'; cx.fillRect(10, 20, 12, 3);
}

function makeSlimeSprite(cx) {
  cx.fillStyle = '#64dc50';
  cx.beginPath(); cx.ellipse(16, 16, 10, 6, 0, 0, Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(16, 10, 8, 6, 0, 0, Math.PI*2); cx.fill();
  cx.fillStyle = '#fff'; cx.fillRect(10, 9, 4, 4); cx.fillRect(18, 9, 4, 4);
  cx.fillStyle = '#000'; cx.fillRect(11, 10, 2, 2); cx.fillRect(19, 10, 2, 2);
}

function makeSkeletonSprite(cx) {
  cx.fillStyle = '#d2d2c8';
  cx.fillRect(12, 2, 8, 8); // skull
  cx.fillStyle = '#000'; cx.fillRect(14, 4, 2, 2); cx.fillRect(17, 4, 2, 2);
  cx.fillStyle = '#d2d2c8';
  cx.fillRect(15, 10, 2, 8); // spine
  cx.fillRect(10, 12, 12, 2); cx.fillRect(11, 15, 10, 2); // ribs
  cx.fillRect(6, 12, 5, 2); cx.fillRect(21, 12, 5, 2); // arms
  cx.fillRect(12, 20, 3, 8); cx.fillRect(17, 20, 3, 8); // legs
}

function makeBatSprite(cx) {
  cx.fillStyle = '#a03cc8';
  cx.beginPath(); cx.moveTo(4, 6); cx.lineTo(14, 12); cx.lineTo(4, 18); cx.fill();
  cx.beginPath(); cx.moveTo(28, 6); cx.lineTo(18, 12); cx.lineTo(28, 18); cx.fill();
  cx.fillStyle = '#641e8c';
  cx.beginPath(); cx.ellipse(16, 12, 5, 4, 0, 0, Math.PI*2); cx.fill();
  cx.fillStyle = '#ff0000'; cx.fillRect(14, 10, 2, 2); cx.fillRect(17, 10, 2, 2);
}

function makeBossSprite(cx) {
  cx.fillStyle = '#3c1414'; cx.fillRect(12, 12, 20, 14); // body
  cx.fillStyle = '#501e1e'; cx.fillRect(6, 10, 10, 8); cx.fillRect(28, 10, 10, 8); // shoulders
  cx.fillStyle = '#280f0f'; cx.fillRect(14, 0, 14, 14); // helmet
  cx.fillStyle = '#b42828'; cx.fillRect(15, 2, 12, 4); // visor
  // Horns
  cx.fillStyle = '#321414';
  cx.beginPath(); cx.moveTo(14, 0); cx.lineTo(10, -4); cx.lineTo(14, 6); cx.fill();
  cx.beginPath(); cx.moveTo(28, 0); cx.lineTo(32, -4); cx.lineTo(28, 6); cx.fill();
  cx.fillStyle = '#321414'; cx.fillRect(14, 26, 6, 10); cx.fillRect(24, 26, 6, 10);
  cx.fillStyle = '#3c1414'; cx.fillRect(4, 14, 8, 6); cx.fillRect(32, 14, 8, 6);
  // Sword
  cx.fillStyle = '#c83c3c'; cx.fillRect(33, 6, 5, 20);
  cx.fillStyle = '#ffc864'; cx.fillRect(32, 4, 7, 3);
}

function makeBulletSprite(cx, color, size) {
  cx.fillStyle = color;
  cx.beginPath(); cx.arc(16, 16, size/2, 0, Math.PI*2); cx.fill();
}

function makeLaserSprite(cx, color) {
  cx.fillStyle = color; cx.fillRect(0, 13, 30, 6);
}

function makeHeartSprite(cx) {
  cx.fillStyle = '#dc3232';
  cx.fillRect(12, 8, 4, 4); cx.fillRect(18, 8, 4, 4);
  cx.fillRect(10, 10, 12, 2); cx.fillRect(8, 12, 16, 2);
  cx.fillRect(8, 14, 16, 2); cx.fillRect(10, 16, 12, 2);
  cx.fillRect(12, 18, 8, 2); cx.fillRect(14, 20, 4, 2);
}

function makeEnergySprite(cx) {
  cx.fillStyle = '#3264dc'; cx.fillRect(10, 2, 8, 20);
  cx.fillStyle = '#64a0ff'; cx.fillRect(12, 4, 4, 16);
  cx.fillStyle = '#32c8c8'; cx.fillRect(14, 6, 1, 12);
}

function makeCoinSprite(cx) {
  cx.fillStyle = '#dcdc32'; cx.beginPath(); cx.arc(16, 16, 6, 0, Math.PI*2); cx.fill();
  cx.fillStyle = '#fff0a0'; cx.beginPath(); cx.arc(16, 16, 3, 0, Math.PI*2); cx.fill();
}

// Pre-render sprites
const SPRITES = {};
function initSprites() {
  SPRITES.player = drawSprite('player', makePlayerSprite);
  SPRITES.slime = drawSprite('slime', makeSlimeSprite);
  SPRITES.skeleton = drawSprite('skeleton', makeSkeletonSprite);
  SPRITES.bat = drawSprite('bat', makeBatSprite);
  SPRITES.boss = drawSprite('boss', makeBossSprite);
  for (const [k, w] of Object.entries(WEAPON_DATA)) {
    SPRITES['bullet_'+k] = drawSprite('bullet', makeBulletSprite, w.color, w.type==='laser'?8:6);
  }
  SPRITES.heart = drawSprite('heart', makeHeartSprite);
  SPRITES.energy = drawSprite('energy', makeEnergySprite);
  SPRITES.coin = drawSprite('coin', makeCoinSprite);
}

// ═══════════════════════════════════════════════════════════════
// PROJECTILE
// ═══════════════════════════════════════════════════════════════
class Projectile {
  constructor(x, y, vx, vy, dmg, color, size=6, piercing=false, lifetime=5) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.dmg = dmg; this.color = color; this.size = size;
    this.piercing = piercing; this.lifetime = lifetime;
    this.alive = true; this.hitEnemies = new Set();
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.lifetime -= dt;
    if (this.lifetime <= 0) this.alive = false;
  }
  draw(camera) {
    const sx = this.x - camera.x, sy = this.y - camera.y;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(sx, sy, this.size/2, 0, Math.PI*2);
    ctx.fill();
  }
}

class SlashEffect {
  constructor(x, y, angle, dmg, size=60, duration=0.15) {
    this.x = x; this.y = y; this.angle = angle; this.dmg = dmg;
    this.size = size; this.duration = duration; this.timer = duration;
    this.alive = true; this.hitEnemies = new Set();
  }
  update(dt) { this.timer -= dt; if (this.timer <= 0) this.alive = false; }
  draw(camera) {
    const sx = this.x - camera.x, sy = this.y - camera.y;
    const a = this.angle;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(a - Math.PI/2);
    ctx.strokeStyle = '#a032dc'; ctx.lineWidth = 4;
    ctx.globalAlpha = this.timer / this.duration;
    ctx.beginPath(); ctx.arc(0, 0, this.size/2, -0.8, 0.8); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// WEAPON
// ═══════════════════════════════════════════════════════════════
class Weapon {
  constructor(key) {
    const d = WEAPON_DATA[key];
    this.key = key; this.name = d.name; this.dmg = d.dmg;
    this.fireRate = d.rate; this.magSize = d.mag; this.reloadTime = d.reload;
    this.bspeed = d.bspeed; this.spread = d.spread; this.eCost = d.eCost;
    this.wtype = d.type; this.color = d.color; this.pellets = d.pellets || 1;
    this.range = d.range || 50;
    this.ammo = this.magSize; this.reloading = false;
    this.reloadTimer = 0; this.fireTimer = 0;
    this.baseFireRate = this.fireRate;
  }
  update(dt) {
    if (this.fireTimer > 0) this.fireTimer -= dt;
    if (this.reloading) {
      this.reloadTimer -= dt;
      if (this.reloadTimer <= 0) { this.ammo = this.magSize; this.reloading = false; }
    }
  }
  canFire(energy) {
    return !this.reloading && this.fireTimer <= 0 && this.ammo > 0 && this.eCost <= energy;
  }
  fire(x, y, angle) {
    if (this.fireTimer > 0) return [];
    this.fireTimer = this.fireRate; this.ammo--;
    if (this.ammo <= 0 && isFinite(this.magSize)) { this.reloading = true; this.reloadTimer = this.reloadTime; }
    const results = [];
    const halfSpread = this.spread * 0.5;
    if (this.wtype === 'proj') {
      const a = angle + randRange(-halfSpread, halfSpread);
      const [vx, vy] = vecFromAngle(a, this.bspeed);
      results.push(new Projectile(x, y, vx, vy, this.dmg, this.color, 6));
    } else if (this.wtype === 'shotgun') {
      for (let i = 0; i < this.pellets; i++) {
        const a = angle + randRange(-halfSpread, halfSpread);
        const [vx, vy] = vecFromAngle(a, this.bspeed);
        results.push(new Projectile(x, y, vx, vy, this.dmg, this.color, 4));
      }
    } else if (this.wtype === 'laser') {
      const [vx, vy] = vecFromAngle(angle, this.bspeed);
      results.push(new Projectile(x, y, vx, vy, this.dmg, this.color, 8, true, 0.5));
    } else if (this.wtype === 'melee') {
      results.push(new SlashEffect(x, y, angle, this.dmg, this.range));
    }
    return results;
  }
  reload() {
    if (!this.reloading && this.ammo < this.magSize) { this.reloading = true; this.reloadTimer = this.reloadTime; }
  }
  ammoFrac() { return isFinite(this.magSize) ? this.ammo / this.magSize : 1.0; }
}

// ═══════════════════════════════════════════════════════════════
// ENTITIES: Player, Enemy, Boss
// ═══════════════════════════════════════════════════════════════
class Player {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = PLAYER_SIZE; this.h = PLAYER_SIZE + 4;
    this.speed = PLAYER_SPEED;
    this.maxHp = PLAYER_MAX_HP; this.hp = PLAYER_MAX_HP;
    this.maxShield = PLAYER_MAX_SHIELD; this.shield = PLAYER_MAX_SHIELD;
    this.shieldRegenTimer = 0;
    this.maxEnergy = PLAYER_MAX_ENERGY; this.energy = PLAYER_MAX_ENERGY;
    this.weapon = new Weapon('pistol');
    this.projectiles = [];
    this.skillCD = 8.0; this.skillCDTimer = 0;
    this.skillActive = false; this.skillTimer = 0;
    this.alive = true; this.dmgMult = 1.0;
    this.speedMult = 1.0; this.fireRateMult = 1.0;
    this.score = 0; this.facingAngle = 0;
  }
  get cx() { return this.x + this.w/2; }
  get cy() { return this.y + this.h/2; }
  takeDamage(amount) {
    this.shieldRegenTimer = 0;
    let rem = amount;
    if (this.shield > 0) { const ab = Math.min(this.shield, rem); this.shield -= ab; rem -= ab; }
    if (rem > 0) { this.hp -= rem; if (this.hp <= 0) { this.hp = 0; this.alive = false; } }
  }
  heal(amt) { this.hp = Math.min(this.maxHp, this.hp + amt); }
  restoreEnergy(amt) { this.energy = Math.min(this.maxEnergy, this.energy + amt); }
  update(dt, roomRect, camera) {
    if (!this.alive) return;
    // Movement
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy = -1;
    if (keys['s'] || keys['arrowdown']) dy = 1;
    if (keys['a'] || keys['arrowleft']) dx = -1;
    if (keys['d'] || keys['arrowright']) dx = 1;
    if (dx || dy) { const [nx, ny] = norm(dx, dy); dx = nx; dy = ny; }
    const spd = this.speed * this.speedMult;
    this.x += dx * spd * dt; this.y += dy * spd * dt;
    const m = 10;
    this.x = clamp(this.x, roomRect.x + m, roomRect.x + roomRect.w - this.w - m);
    this.y = clamp(this.y, roomRect.y + m, roomRect.y + roomRect.h - this.h - m);
    // Aiming
    this.facingAngle = angleTo([this.cx, this.cy], [mouseWorld.x, mouseWorld.y]);
    // Shield regen
    if (this.shield < this.maxShield) {
      this.shieldRegenTimer += dt;
      if (this.shieldRegenTimer >= PLAYER_SHIELD_REGEN_DELAY)
        this.shield = Math.min(this.maxShield, this.shield + PLAYER_SHIELD_REGEN * dt);
    }
    // Energy regen
    if (this.energy < this.maxEnergy)
      this.energy = Math.min(this.maxEnergy, this.energy + PLAYER_ENERGY_REGEN * dt);
    // Skill
    if (this.skillActive) {
      this.skillTimer -= dt;
      if (this.skillTimer <= 0) { this.skillActive = false; this.fireRateMult = 1.0; }
    }
    if (this.skillCDTimer > 0) this.skillCDTimer = Math.max(0, this.skillCDTimer - dt);
    // Weapon
    if (this.weapon) {
      this.weapon.fireRate = this.weapon.baseFireRate / this.fireRateMult;
      this.weapon.update(dt);
    }
    // Projectiles
    for (const p of this.projectiles) p.update(dt);
    this.projectiles = this.projectiles.filter(p => p.alive);
  }
  shoot(camera) {
    if (!this.weapon || !this.alive) return [];
    if (!this.weapon.canFire(this.energy)) return [];
    const projs = this.weapon.fire(this.cx, this.cy, this.facingAngle);
    this.energy -= this.weapon.eCost;
    this.projectiles.push(...projs);
    return projs;
  }
  useSkill() {
    if (this.skillCDTimer > 0 || this.skillActive) return false;
    this.skillActive = true; this.skillTimer = 3.0;
    this.skillCDTimer = 8.0; this.fireRateMult = 2.0;
    return true;
  }
  draw(camera) {
    if (!this.alive) return;
    const sx = this.x - camera.x, sy = this.y - camera.y;
    ctx.drawImage(SPRITES.player, sx - 4, sy - 2);
    if (this.skillActive) {
      ctx.strokeStyle = 'rgba(255,200,50,0.6)'; ctx.lineWidth = 3;
      ctx.strokeRect(sx - 6, sy - 5, SPRITES.player.width + 4, SPRITES.player.height + 4);
    }
  }
}

class Enemy {
  constructor(x, y, type, floorNum=1) {
    const d = ENEMY_DATA[type];
    this.etype = type; this.name = d.name;
    this.x = x; this.y = y; this.speed = d.speed;
    this.dmg = d.dmg; this.size = d.size; this.color = d.color;
    this.behavior = d.behavior; this.atkRange = d.atkRange;
    this.atkCD = d.atkCD; this.projSpeed = d.projSpeed;
    this.prefDist = d.prefDist || 200; this.scoreVal = d.score;
    this.maxHp = Math.floor(d.hp * (1 + 0.2 * (floorNum - 1)));
    this.hp = this.maxHp; this.alive = true;
    this.atkTimer = Math.random() * this.atkCD;
    this.projectiles = [];
    this.erraticAngle = Math.random() * Math.PI * 2;
    this.erraticTimer = 0; this.erraticInterval = randRange(0.5, 1.5);
    this.lastContactHit = 0;
  }
  get cx() { return this.x; }
  get cy() { return this.y; }
  takeDamage(amt) { this.hp -= amt; if (this.hp <= 0) { this.hp = 0; this.alive = false; } }
  update(dt, player, roomRect) {
    if (!this.alive) return;
    this.lastContactHit -= dt;
    const px = player.cx, py = player.cy;
    const d = dist([this.x, this.y], [px, py]);
    const angle = angleTo([this.x, this.y], [px, py]);
    let dx = 0, dy = 0;
    if (this.behavior === 'chase') {
      if (d > this.size + player.w/2) {
        [dx, dy] = norm(px - this.x, py - this.y);
        dx *= this.speed; dy *= this.speed;
      }
    } else if (this.behavior === 'keep_distance') {
      if (d < this.prefDist - 20) { [dx, dy] = norm(this.x - px, this.y - py); dx *= this.speed; dy *= this.speed; }
      else if (d > this.prefDist + 20) { [dx, dy] = norm(px - this.x, py - this.y); dx *= this.speed; dy *= this.speed; }
    } else if (this.behavior === 'erratic') {
      this.erraticTimer += dt;
      if (this.erraticTimer >= this.erraticInterval) {
        this.erraticAngle = Math.random() * Math.PI*2;
        this.erraticTimer = 0; this.erraticInterval = randRange(0.3, 1.2);
      }
      dx = Math.cos(this.erraticAngle) * this.speed + (px - this.x) * 0.3;
      dy = Math.sin(this.erraticAngle) * this.speed + (py - this.y) * 0.3;
    }
    this.x += dx * dt; this.y += dy * dt;
    const m = 10;
    this.x = clamp(this.x, roomRect.x + m, roomRect.x + roomRect.w - this.size - m);
    this.y = clamp(this.y, roomRect.y + m, roomRect.y + roomRect.h - this.size - m);
    // Attack
    this.atkTimer -= dt;
    if (this.atkRange > 0 && d < this.atkRange && this.atkTimer <= 0) {
      this.atkTimer = this.atkCD;
      const a = angleTo([this.x, this.y], [px, py]);
      const [vx, vy] = vecFromAngle(a, this.projSpeed);
      this.projectiles.push(new Projectile(this.x, this.y, vx, vy, this.dmg, '#dc3232', 5, false, 3));
    }
    for (const p of this.projectiles) p.update(dt);
    this.projectiles = this.projectiles.filter(p => p.alive);
  }
  draw(camera) {
    if (!this.alive) return;
    const sx = this.x - camera.x, sy = this.y - camera.y;
    const spriteKey = this.etype === 'boss' ? 'boss' : this.etype;
    ctx.drawImage(SPRITES[spriteKey], sx - 12, sy - 12);
    if (this.hp < this.maxHp) {
      const bw = this.size + 4, bh = 3;
      const bx = sx - bw/2, by = sy - this.size/2 - 6;
      ctx.fillStyle = '#282828'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#dc3232'; ctx.fillRect(bx, by, bw * (this.hp/this.maxHp), bh);
    }
  }
}

class Boss extends Enemy {
  constructor(x, y, floorNum) {
    super(x, y, 'slime', floorNum); // dummy call, override below
    const d = BOSS_DATA;
    this.etype = 'boss'; this.name = d.name;
    this.speed = d.speed; this.dmg = d.dmg; this.size = d.size; this.color = d.color;
    this.behavior = 'chase'; this.atkRange = 350; this.atkCD = 1.0;
    this.projSpeed = 250; this.scoreVal = d.score;
    this.maxHp = Math.floor(d.hp * (1 + 0.2 * (floorNum-1)));
    this.hp = this.maxHp; this.alive = true;
    this.atkTimer = 2.0; this.projectiles = [];
    this.chargeTarget = null; this.chargeSpeed = 350;
    this.bulletPatternTimer = 0;
  }
  _getPattern() {
    const hpFrac = this.hp / this.maxHp;
    if (hpFrac <= 0.2) return 'berserk';
    if (hpFrac <= 0.5) return 'fan_shot';
    return 'charge';
  }
  update(dt, player, roomRect) {
    if (!this.alive) return;
    this.lastContactHit -= dt;
    const px = player.cx, py = player.cy;
    const d = dist([this.x, this.y], [px, py]);
    const pattern = this._getPattern();
    let dx = 0, dy = 0;
    if (pattern === 'charge') {
      if (d > 60) { [dx, dy] = norm(px - this.x, py - this.y); dx *= this.speed; dy *= this.speed; }
      this.atkTimer -= dt;
      if (this.atkTimer <= 0) { this.atkTimer = 1.5; this.chargeTarget = [px, py]; }
      if (this.chargeTarget) {
        const cd = dist([this.x, this.y], this.chargeTarget);
        if (cd < 30) this.chargeTarget = null;
        else { [dx, dy] = norm(this.chargeTarget[0]-this.x, this.chargeTarget[1]-this.y); dx *= this.chargeSpeed; dy *= this.chargeSpeed; }
      }
    } else if (pattern === 'fan_shot') {
      if (d < 120) { [dx, dy] = norm(this.x-px, this.y-py); dx *= this.speed*0.8; dy *= this.speed*0.8; }
      else if (d > 250) { [dx, dy] = norm(px-this.x, py-this.y); dx *= this.speed; dy *= this.speed; }
      this.bulletPatternTimer -= dt;
      if (this.bulletPatternTimer <= 0) {
        this.bulletPatternTimer = 0.8;
        const base = angleTo([this.x, this.y], [px, py]);
        for (const off of [-0.5, -0.25, 0, 0.25, 0.5]) {
          const [vx, vy] = vecFromAngle(base+off, this.projSpeed);
          this.projectiles.push(new Projectile(this.x, this.y, vx, vy, this.dmg, '#dc5028', 6, false, 3));
        }
      }
    } else { // berserk
      if (d > 40) { [dx, dy] = norm(px-this.x, py-this.y); dx *= this.speed*1.6; dy *= this.speed*1.6; }
      this.atkTimer -= dt;
      if (this.atkTimer <= 0) {
        this.atkTimer = 0.5;
        const base = angleTo([this.x, this.y], [px, py]);
        for (const off of [-0.3, 0, 0.3]) {
          const [vx, vy] = vecFromAngle(base+off, this.projSpeed*1.3);
          this.projectiles.push(new Projectile(this.x, this.y, vx, vy, this.dmg, '#dc5028', 5, false, 3));
        }
      }
    }
    this.x += dx * dt; this.y += dy * dt;
    const m = 10;
    this.x = clamp(this.x, roomRect.x+m, roomRect.x+roomRect.w-this.size-m);
    this.y = clamp(this.y, roomRect.y+m, roomRect.y+roomRect.h-this.size-m);
    for (const p of this.projectiles) p.update(dt);
    this.projectiles = this.projectiles.filter(p => p.alive);
  }
  draw(camera) {
    if (!this.alive) return;
    const sx = this.x - camera.x, sy = this.y - camera.y;
    ctx.drawImage(SPRITES.boss, sx - 18, sy - 18);
    // Boss HP bar at top of screen
    const bw = 300, bh = 12;
    const bx = W/2 - bw/2, by = 16;
    ctx.fillStyle = '#282828'; ctx.fillRect(bx, by, bw, bh);
    const frac = this.hp / this.maxHp;
    ctx.fillStyle = frac > 0.3 ? '#dc3232' : '#ff3232';
    ctx.fillRect(bx, by, bw * frac, bh);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace';
    ctx.fillText(this.name, bx, by - 4);
  }
}

// ═══════════════════════════════════════════════════════════════
// ITEMS & BUFFS
// ═══════════════════════════════════════════════════════════════
class Item {
  constructor(x, y, type) {
    this.type = type; this.x = x; this.y = y; this.alive = true;
    this.bobTimer = 0; this.bobOffset = 0;
    if (type === 'heart') { this.healHp = 2; this.healEnergy = 0; this.score = 0; this.size = 10; }
    else if (type === 'energy') { this.healHp = 0; this.healEnergy = 30; this.score = 0; this.size = 10; }
    else if (type === 'coin') { this.healHp = 0; this.healEnergy = 0; this.score = 50; this.size = 8; }
  }
  update(dt) { this.bobTimer += dt; this.bobOffset = Math.sin(this.bobTimer * 3) * 3; }
  apply(player) {
    if (this.healHp) player.heal(this.healHp);
    if (this.healEnergy) player.restoreEnergy(this.healEnergy);
    if (this.score) player.score += this.score;
  }
  draw(camera) {
    if (!this.alive) return;
    const sx = this.x - camera.x, sy = this.y - camera.y + this.bobOffset;
    const s = SPRITES[this.type];
    if (s) ctx.drawImage(s, sx - s.width/2, sy - s.height/2);
  }
}

class Buff {
  constructor(name, duration, effect, color) {
    this.name = name; this.duration = duration;
    this.timer = duration; this.effect = effect;
    this.color = color; this.active = true;
  }
  update(dt) { this.timer -= dt; if (this.timer <= 0) this.active = false; }
  frac() { return Math.max(0, this.timer / this.duration); }
  applyStart(player) {
    if (this.effect === 'speed_boost') player.speedMult = 1.5;
    else if (this.effect === 'damage_boost') player.dmgMult = 2.0;
  }
  remove(player) {
    if (this.effect === 'speed_boost') player.speedMult = 1.0;
    else if (this.effect === 'damage_boost') player.dmgMult = 1.0;
  }
}

// ═══════════════════════════════════════════════════════════════
// DUNGEON
// ═══════════════════════════════════════════════════════════════
class Room {
  constructor(gx, gy, type='combat') {
    this.gx = gx; this.gy = gy; this.type = type;
    this.cleared = false; this.visited = false;
    this.rect = { x: 0, y: 0, w: ROOM_W, h: ROOM_H };
    this.doors = { up: false, down: false, left: false, right: false };
    this.obstacles = [];
    this._genObstacles();
    this.center = [ROOM_W/2, ROOM_H/2];
  }
  _genObstacles() {
    const seed = this.gx * 137 + this.gy * 257;
    const rng = ((s) => { return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; })(seed);
    const count = Math.floor(rng() * 5) + 2;
    for (let i = 0; i < count; i++) {
      const w = rng() * 40 + 40, h = rng() * 40 + 40;
      const x = rng() * (ROOM_W - w - 160) + 80;
      const y = rng() * (ROOM_H - h - 120) + 60;
      this.obstacles.push({ x, y, w, h });
    }
  }
  spawnEnemies(floorNum) {
    const enemies = [];
    if (this.type === 'start' || this.type === 'shop') return enemies;
    const seed = this.gx * 313 + this.gy * 419 + floorNum * 73;
    const rng = ((s) => { return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; })(seed);
    if (this.type === 'boss') {
      enemies.push(new Boss(ROOM_W/2, ROOM_H/3, floorNum));
      return enemies;
    }
    const count = Math.floor(rng() * 4) + 2;
    const types = ['slime', 'skeleton', 'bat'];
    if (floorNum >= 2) types.push('skeleton');
    if (floorNum >= 3) types.push('skeleton');
    for (let i = 0; i < count; i++) {
      const et = types[Math.floor(rng() * types.length)];
      const ex = rng() * (ROOM_W - 200) + 100;
      const ey = rng() * (ROOM_H - 160) + 80;
      enemies.push(new Enemy(ex, ey, et, floorNum));
    }
    return enemies;
  }
  spawnLoot(floorNum) {
    const items = [];
    if (this.type === 'start') return items;
    const seed = this.gx * 619 + this.gy * 727 + floorNum * 73;
    const rng = ((s) => { return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; })(seed);
    if (this.type === 'boss') {
      items.push(new Item(ROOM_W/2, ROOM_H/2 - 20, 'heart'));
      items.push(new Item(ROOM_W/2, ROOM_H/2 + 20, 'energy'));
      items.push(new Item(ROOM_W/2 + 30, ROOM_H/2, 'coin'));
      return items;
    }
    const count = Math.floor(rng() * 3);
    const types = ['heart', 'energy', 'coin'];
    for (let i = 0; i < count; i++) {
      const it = types[Math.floor(rng() * types.length)];
      const ix = rng() * (ROOM_W - 240) + 120;
      const iy = rng() * (ROOM_H - 200) + 100;
      items.push(new Item(ix, iy, it));
    }
    return items;
  }
  playerEntryPos(fromDir) {
    // Player enters from this direction; spawn at opposite side
    const opp = { up:'down', down:'up', left:'right', right:'left' }[fromDir];
    if (opp === 'up') return [ROOM_W/2, ROOM_H - 60];
    if (opp === 'down') return [ROOM_W/2, 60];
    if (opp === 'left') return [ROOM_W - 60, ROOM_H/2];
    return [60, ROOM_H/2];
  }

  draw(camera) {
    const { x: rx, y: ry, w: rw, h: rh } = this.rect;
    // Floor
    ctx.fillStyle = '#3c3228';
    ctx.fillRect(rx - camera.x, ry - camera.y, rw, rh);
    // Floor pattern
    ctx.fillStyle = '#443830';
    for (let tx = 0; tx < rw; tx += TILE) {
      for (let ty = 0; ty < rh; ty += TILE) {
        if ((tx / TILE + ty / TILE) % 2 === 0) {
          ctx.fillRect(rx + tx - camera.x, ry + ty - camera.y, TILE, TILE);
        }
      }
    }
    // Walls
    ctx.fillStyle = '#505050';
    ctx.fillRect(rx - camera.x, ry - camera.y, rw, 8);
    ctx.fillRect(rx - camera.x, ry + rh - 8 - camera.y, rw, 8);
    ctx.fillRect(rx - camera.x, ry - camera.y, 8, rh);
    ctx.fillRect(rx + rw - 8 - camera.x, ry - camera.y, 8, rh);
    // Doors
    const ds = 60;
    ctx.fillStyle = '#141414';
    if (this.doors.up) ctx.fillRect(rx + rw/2 - ds/2 - camera.x, ry - 4 - camera.y, ds, 12);
    if (this.doors.down) ctx.fillRect(rx + rw/2 - ds/2 - camera.x, ry + rh - 8 - camera.y, ds, 12);
    if (this.doors.left) ctx.fillRect(rx - 4 - camera.x, ry + rh/2 - ds/2 - camera.y, 12, ds);
    if (this.doors.right) ctx.fillRect(rx + rw - 8 - camera.x, ry + rh/2 - ds/2 - camera.y, 12, ds);
    // Obstacles
    for (const o of this.obstacles) {
      ctx.fillStyle = '#503214';
      ctx.fillRect(rx + o.x - camera.x, ry + o.y - camera.y, o.w, o.h);
      ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 2;
      ctx.strokeRect(rx + o.x - camera.x, ry + o.y - camera.y, o.w, o.h);
    }
    // Door markers
    ctx.fillStyle = 'rgba(255,255,200,0.7)';
    for (const d of ['up','down','left','right']) {
      if (!this.doors[d]) continue;
      let mx, my;
      if (d === 'up') { mx = rw/2; my = 14; }
      else if (d === 'down') { mx = rw/2; my = rh - 22; }
      else if (d === 'left') { mx = 14; my = rh/2; }
      else { mx = rw - 22; my = rh/2; }
      ctx.beginPath();
      if (d === 'up') { ctx.moveTo(rx+mx-camera.x, ry+my-8-camera.y); ctx.lineTo(rx+mx-8-camera.x, ry+my+4-camera.y); ctx.lineTo(rx+mx+8-camera.x, ry+my+4-camera.y); }
      else if (d === 'down') { ctx.moveTo(rx+mx-camera.x, ry+my+8-camera.y); ctx.lineTo(rx+mx-8-camera.x, ry+my-4-camera.y); ctx.lineTo(rx+mx+8-camera.x, ry+my-4-camera.y); }
      else if (d === 'left') { ctx.moveTo(rx+mx-8-camera.x, ry+my-camera.y); ctx.lineTo(rx+mx+4-camera.x, ry+my-8-camera.y); ctx.lineTo(rx+mx+4-camera.x, ry+my+8-camera.y); }
      else { ctx.moveTo(rx+mx+8-camera.x, ry+my-camera.y); ctx.lineTo(rx+mx-4-camera.x, ry+my-8-camera.y); ctx.lineTo(rx+mx-4-camera.x, ry+my+8-camera.y); }
      ctx.fill();
    }
  }
}

class Dungeon {
  constructor(size, floorNum) {
    this.size = size; this.floorNum = floorNum;
    this.grid = {}; this.currentRoom = null;
    this.startRoom = null; this.bossRoom = null;
    this._generate();
  }
  _opposite(d) { return { up:'down', down:'up', left:'right', right:'left' }[d]; }
  _generate() {
    const cx = Math.floor(this.size/2), cy = Math.floor(this.size/2);
    this.grid = {};
    const start = new Room(cx, cy, 'start');
    this.grid[`${cx},${cy}`] = start;
    this.startRoom = start;
    let roomCount = 1;
    const queue = [[cx, cy]];
    const visited = new Set([`${cx},${cy}`]);
    const targetCount = randInt(MIN_ROOMS, MAX_ROOMS);
    while (queue.length && roomCount < targetCount) {
      const [gx, gy] = queue.shift();
      const dirs = [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]];
      // Shuffle
      for (let i = dirs.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [dirs[i], dirs[j]] = [dirs[j], dirs[i]]; }
      for (const [dname, dx, dy] of dirs) {
        const nx = gx+dx, ny = gy+dy;
        if (nx < 0 || nx >= this.size || ny < 0 || ny >= this.size) continue;
        const key = `${nx},${ny}`;
        if (visited.has(key)) continue;
        if (Math.random() < 0.65 || roomCount < MIN_ROOMS) {
          let rtype = 'combat';
          if (roomCount === targetCount - 1) rtype = 'boss';
          else if (Math.random() < 0.10 && roomCount > 3) rtype = 'treasure';
          else if (Math.random() < 0.08 && roomCount > 2) rtype = 'shop';
          const room = new Room(nx, ny, rtype);
          this.grid[key] = room; roomCount++;
          room.doors[this._opposite(dname)] = true;
          this.grid[`${gx},${gy}`].doors[dname] = true;
          visited.add(key); queue.push([nx, ny]);
          if (rtype === 'boss') this.bossRoom = room;
        }
      }
    }
    if (!this.bossRoom) {
      let farthest = start, maxD = 0;
      for (const [key, room] of Object.entries(this.grid)) {
        const [gx, gy] = key.split(',').map(Number);
        const d = Math.abs(gx-cx) + Math.abs(gy-cy);
        if (d > maxD) { maxD = d; farthest = room; }
      }
      farthest.type = 'boss'; this.bossRoom = farthest;
    }
    this.currentRoom = start; this.currentRoom.visited = true;
  }
  tryTransition(px, py) {
    // px, py should be player CENTER (not top-left)
    const room = this.currentRoom;
    const m = 25; // generous detection zone around doors
    if (py < m && room.doors.up) return this._doTransition('up');
    if (py > ROOM_H - m && room.doors.down) return this._doTransition('down');
    if (px < m && room.doors.left) return this._doTransition('left');
    if (px > ROOM_W - m && room.doors.right) return this._doTransition('right');
    return null;
  }
  _doTransition(dir) {
    const [dx, dy] = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[dir];
    const key = `${this.currentRoom.gx+dx},${this.currentRoom.gy+dy}`;
    const newRoom = this.grid[key];
    if (newRoom) { this.currentRoom = newRoom; this.currentRoom.visited = true; }
    return newRoom;
  }
  drawMinimap(ox, oy, size=110) {
    const cell = Math.floor(size / this.size);
    for (const [key, room] of Object.entries(this.grid)) {
      if (!room.visited) continue;
      const [gx, gy] = key.split(',').map(Number);
      const rx = ox + gx * cell, ry = oy + gy * cell;
      let color = '#808080';
      if (room === this.currentRoom) color = '#ffffff';
      else if (room.type === 'boss') color = '#dc3232';
      else if (room.type === 'treasure') color = '#dcdc32';
      else if (room.type === 'shop') color = '#32c8c8';
      else if (room.cleared) color = '#404040';
      ctx.fillStyle = color; ctx.fillRect(rx+1, ry+1, cell-2, cell-2);
      // Connections
      for (const [d, dx, dy] of [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]]) {
        if (!room.doors[d]) continue;
        const nk = `${gx+dx},${gy+dy}`;
        const nRoom = this.grid[nk];
        if (nRoom && nRoom.visited) {
          ctx.strokeStyle = '#808080'; ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(rx+cell/2, ry+cell/2);
          ctx.lineTo(rx+cell/2+dx*cell/2, ry+cell/2+dy*cell/2);
          ctx.stroke();
        }
      }
    }
    ctx.strokeStyle = '#808080'; ctx.lineWidth = 1;
    ctx.strokeRect(ox, oy, size, size);
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME
// ═══════════════════════════════════════════════════════════════
class Game {
  constructor() {
    this.state = 'TITLE'; // TITLE | PLAYING | PAUSED | DEAD | FLOOR_TRANSITION
    this.player = null; this.dungeon = null;
    this.enemies = []; this.items = []; this.buffs = [];
    this.floorNum = 1; this.maxFloors = 3;
    this.camera = { x: 0, y: 0 };
    this.transitionTimer = 0; this.transitionDuration = 2.0;
    this.shakeTimer = 0; this.shakeIntensity = 0;
    this.particles = [];
    this.lastTime = performance.now();
  }

  newGame() {
    this.floorNum = 1; this.buffs = [];
    this._startFloor();
  }

  _startFloor() {
    this.dungeon = new Dungeon(DUNGEON_SIZE, this.floorNum);
    const room = this.dungeon.currentRoom;
    const [px, py] = room.center;
    this.player = new Player(px, py);
    if (this.floorNum === 1) this.player.weapon = new Weapon('pistol');
    this.enemies = room.spawnEnemies(this.floorNum);
    this.items = room.spawnLoot(this.floorNum);
    this._updateCamera();
  }

  _updateCamera() {
    this.camera.x = this.dungeon.currentRoom.rect.x;
    this.camera.y = this.dungeon.currentRoom.rect.y;
  }

  _nextFloor() {
    this.floorNum++;
    if (this.floorNum > this.maxFloors) {
      this.state = 'DEAD'; this.player.alive = false;
      return;
    }
    this._startFloor();
    const weapons = ['pistol', 'rifle', 'shotgun', 'laser', 'sword'];
    this.player.weapon = new Weapon(randChoice(weapons));
  }

  _spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI*2;
      const s = randRange(50, 200);
      this.particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: randRange(0.2, 0.6), color });
    }
  }

  _updateParticles(dt) {
    for (let i = this.particles.length-1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }

  _handleCollisions() {
    const player = this.player;
    // Player projectiles vs enemies
    for (const proj of player.projectiles) {
      if (!proj.alive) continue;
      for (const enemy of this.enemies) {
        if (!enemy.alive || proj.hitEnemies.has(enemy)) continue;
        const hitDist = proj instanceof SlashEffect ? (proj.size/2 + enemy.size) : (proj.size/2 + enemy.size);
        const d = dist([proj.x, proj.y], [enemy.x, enemy.y]);
        if (d < hitDist) {
          const dmg = Math.floor(proj.dmg * player.dmgMult);
          enemy.takeDamage(dmg);
          proj.hitEnemies.add(enemy);
          if (!proj.piercing) proj.alive = false;
          this._spawnParticles(enemy.x, enemy.y, 3, '#dc3232');
          if (enemy instanceof Boss) { this.shakeTimer = 0.1; this.shakeIntensity = 4; }
          if (!enemy.alive) {
            player.score += enemy.scoreVal;
            this._spawnParticles(enemy.x, enemy.y, 10, enemy.color);
            this._checkRoomClear();
          }
          break;
        }
      }
    }
    // Enemy projectiles vs player
    for (const enemy of this.enemies) {
      for (const proj of enemy.projectiles) {
        if (!proj.alive) continue;
        const d = dist([proj.x, proj.y], [player.cx, player.cy]);
        if (d < proj.size/2 + player.w/2) {
          player.takeDamage(proj.dmg); proj.alive = false;
          this._spawnParticles(player.cx, player.cy, 5, '#dc3232');
          this.shakeTimer = 0.15; this.shakeIntensity = 6;
        }
      }
    }
    // Enemy contact vs player
    for (const enemy of this.enemies) {
      if (!enemy.alive) continue;
      if (['chase','erratic'].includes(enemy.behavior)) {
        const d = dist([enemy.x, enemy.y], [player.cx, player.cy]);
        if (d < enemy.size + player.w/2 + 4) {
          if (enemy.lastContactHit <= 0) {
            enemy.lastContactHit = 0.5;
            player.takeDamage(enemy.dmg);
            this._spawnParticles(player.cx, player.cy, 3, '#dc3232');
          }
        }
      }
    }
    // Items vs player
    for (let i = this.items.length-1; i >= 0; i--) {
      const item = this.items[i];
      if (!item.alive) continue;
      if (dist([item.x, item.y], [player.cx, player.cy]) < 30) {
        item.apply(player); item.alive = false;
        this.items.splice(i, 1);
      }
    }
  }

  _checkRoomClear() {
    if (this.enemies.some(e => e.alive)) return;
    const room = this.dungeon.currentRoom;
    if (!room.cleared) {
      room.cleared = true;
      if (Math.random() < 0.25) {
        const type = randChoice(['speed_boost', 'damage_boost']);
        const buff = new Buff(type==='speed_boost'?'速度提升':'伤害翻倍', 10, type, type==='speed_boost'?'#32c8c8':'#f08c1e');
        this.buffs.push(buff); buff.applyStart(this.player);
      }
      if (room.type === 'boss') {
        this.transitionTimer = this.transitionDuration;
        this.state = 'FLOOR_TRANSITION';
      }
    }
  }

  _checkRoomTransition() {
    const room = this.dungeon.currentRoom;
    // Allow passing if room cleared, or it's a start/shop room, or no enemies alive
    const hasEnemies = this.enemies.some(e => e.alive);
    if (!room.cleared && hasEnemies) return;
    const newRoom = this.dungeon.tryTransition(this.player.cx, this.player.cy);
    if (newRoom) {
      // Find which direction we came from
      for (const [d, dx, dy] of [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]]) {
        if (!room.doors[d]) continue;
        const nk = `${room.gx+dx},${room.gy+dy}`;
        if (this.dungeon.grid[nk] === newRoom) {
          const [px, py] = newRoom.playerEntryPos(d);
          this.player.x = px; this.player.y = py;
          break;
        }
      }
      this.enemies = newRoom.cleared ? [] : newRoom.spawnEnemies(this.floorNum);
      this.items = newRoom.cleared ? [] : newRoom.spawnLoot(this.floorNum);
      // Auto-clear rooms with no enemies (shop etc.)
      if (this.enemies.length === 0 && !newRoom.cleared) {
        newRoom.cleared = true;
      }
      this._updateCamera();
    }
  }

  update(dt) {
    dt = Math.min(dt, 0.1);
    if (this.state === 'FLOOR_TRANSITION') {
      this.transitionTimer -= dt;
      if (this.transitionTimer <= 0) { this._nextFloor(); this.state = 'PLAYING'; }
      return;
    }
    if (this.state !== 'PLAYING') return;

    // Mouse world pos
    mouseWorld.x = mouse.x + this.camera.x;
    mouseWorld.y = mouse.y + this.camera.y;

    const roomRect = this.dungeon.currentRoom.rect;
    this.player.update(dt, roomRect, this.camera);

    if (mouse.left) this.player.shoot(this.camera);
    if (mouse.right) this.player.useSkill();
    if (consumeKey('r')) this.player.weapon?.reload();

    for (const e of this.enemies) e.update(dt, this.player, roomRect);
    for (const item of this.items) item.update(dt);

    for (let i = this.buffs.length-1; i >= 0; i--) {
      this.buffs[i].update(dt);
      if (!this.buffs[i].active) { this.buffs[i].remove(this.player); this.buffs.splice(i, 1); }
    }

    this._handleCollisions();
    this._checkRoomTransition();
    this._updateParticles(dt);

    if (this.shakeTimer > 0) this.shakeTimer = Math.max(0, this.shakeTimer - dt);
    if (!this.player.alive) this.state = 'DEAD';
  }

  draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    if (this.state === 'TITLE') this._drawTitle();
    else if (['PLAYING','PAUSED','DEAD','FLOOR_TRANSITION'].includes(this.state)) {
      this._drawWorld();
      if (this.state === 'PAUSED') this._drawPause();
      if (this.state === 'DEAD') this._drawDeath();
      if (this.state === 'FLOOR_TRANSITION') this._drawFloorTransition();
    }
  }

  _drawWorld() {
    let sx = 0, sy = 0;
    if (this.shakeTimer > 0) {
      sx = (Math.random() - 0.5) * this.shakeIntensity * 2;
      sy = (Math.random() - 0.5) * this.shakeIntensity * 2;
    }
    const cam = { x: this.camera.x + sx, y: this.camera.y + sy };
    const room = this.dungeon.currentRoom;
    room.draw(cam);
    for (const item of this.items) item.draw(cam);
    for (const enemy of this.enemies) {
      enemy.draw(cam);
      for (const p of enemy.projectiles) p.draw(cam);
    }
    this.player.draw(cam);
    for (const p of this.player.projectiles) p.draw(cam);
    // Particles
    for (const p of this.particles) {
      const px = p.x - cam.x, py = p.y - cam.y;
      ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 0.6;
      ctx.fillRect(px-2, py-2, 4, 4);
    }
    ctx.globalAlpha = 1;
    this._drawHUD();
    // Buffs
    for (let i = 0; i < this.buffs.length; i++) {
      const b = this.buffs[i];
      const bx = W - 130, by = H - 30 - i * 22;
      ctx.fillStyle = '#282828'; ctx.fillRect(bx, by, 100, 6);
      ctx.fillStyle = b.color; ctx.fillRect(bx, by, 100 * b.frac(), 6);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, 100, 6);
      ctx.fillStyle = b.color; ctx.font = '12px monospace'; ctx.fillText(b.name, bx, by - 2);
    }
    // Lock indicator
    const hasEnemies = this.enemies.some(e => e.alive);
    if (!room.cleared && hasEnemies) {
      ctx.fillStyle = '#dc3232'; ctx.font = '18px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('消灭所有敌人才能通过!', W/2, H - 20);
      ctx.textAlign = 'start';
    }
  }

  _drawHUD() {
    const p = this.player, w = p.weapon;
    const m = 12;
    // Shield bar
    const bx = m, by = m;
    let bw = 140, bh = 10;
    ctx.fillStyle = '#282828'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#50a0ff'; ctx.fillRect(bx, by, bw * (p.shield/p.maxShield), bh);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = '#50a0ff'; ctx.font = '11px monospace'; ctx.fillText(`护盾 ${Math.floor(p.shield)}`, bx+4, by-2);
    // HP bar
    const by2 = by + bh + 4;
    ctx.fillStyle = '#282828'; ctx.fillRect(bx, by2, bw, bh);
    ctx.fillStyle = '#dc3232'; ctx.fillRect(bx, by2, bw * (p.hp/p.maxHp), bh);
    ctx.strokeStyle = '#fff'; ctx.strokeRect(bx, by2, bw, bh);
    ctx.fillStyle = '#dc3232'; ctx.fillText(`HP ${Math.floor(p.hp)}/${p.maxHp}`, bx+4, by2-2);
    // Energy bar
    const by3 = by2 + bh + 4;
    ctx.fillStyle = '#282828'; ctx.fillRect(bx, by3, 120, 5);
    ctx.fillStyle = '#3264dc'; ctx.fillRect(bx, by3, 120 * (p.energy/p.maxEnergy), 5);
    ctx.strokeStyle = '#fff'; ctx.strokeRect(bx, by3, 120, 5);
    ctx.fillStyle = '#32c8c8'; ctx.font = '10px monospace'; ctx.fillText(`能量 ${Math.floor(p.energy)}`, bx+4, by3-2);
    // Weapon
    if (w) {
      ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
      ctx.fillText(w.name, m, H - 44);
      const ammoStr = w.reloading ? '装弹中...' : (isFinite(w.magSize) ? `${Math.floor(w.ammo)}` : '∞');
      ctx.fillStyle = w.reloading ? '#dcdc32' : (w.ammo > 0 ? '#fff' : '#dc3232');
      ctx.font = '14px monospace'; ctx.fillText(ammoStr, m, H - 26);
    }
    // Skill
    const sx = bx + bw + 16;
    let skillText, skillColor;
    if (p.skillActive) { skillText = `技能: 双持 ${p.skillTimer.toFixed(1)}s`; skillColor = '#ffc832'; }
    else if (p.skillCDTimer <= 0) { skillText = '技能: 就绪 [右键]'; skillColor = '#32dc32'; }
    else { skillText = `技能: CD ${p.skillCDTimer.toFixed(1)}s`; skillColor = '#808080'; }
    ctx.fillStyle = skillColor; ctx.font = '14px monospace'; ctx.fillText(skillText, sx, by + 14);
    // Floor & Score
    ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`第 ${this.floorNum} 层`, W - m - 80, m + 16);
    ctx.fillStyle = '#dcdc32'; ctx.font = '14px monospace';
    ctx.fillText(`得分: ${p.score}`, W - m - 80, m + 36);
    ctx.textAlign = 'start';
    // Minimap
    if (this.dungeon) this.dungeon.drawMinimap(W - 120, m + 48, 110);
    // Crosshair
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(W/2, H/2, 3, 0, Math.PI*2); ctx.stroke();
  }

  _drawTitle() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const cx = W/2, cy = H/2;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffc832'; ctx.font = 'bold 64px monospace';
    ctx.fillText('元气地牢', cx, cy - 70);
    ctx.fillStyle = '#fff'; ctx.font = '22px monospace';
    ctx.fillText('SOUL DUNGEON', cx, cy - 24);
    ctx.fillStyle = '#808080'; ctx.font = '16px monospace';
    ctx.fillText('— 元气骑士风格 Roguelike —', cx, cy + 10);
    const instructions = [
      'WASD / 方向键 移动    鼠标瞄准    左键射击',
      '右键 技能(双持)    R 换弹    ESC 暂停',
      '1-5 切换武器'
    ];
    for (let i = 0; i < instructions.length; i++) {
      ctx.fillStyle = '#808080'; ctx.font = '15px monospace';
      ctx.fillText(instructions[i], cx, cy + 50 + i * 26);
    }
    if (Math.floor(Date.now()/500) % 2 === 0) {
      ctx.fillStyle = '#dcdc32'; ctx.font = '22px monospace';
      ctx.fillText('按 SPACE 开始游戏', cx, cy + 150);
    }
    ctx.fillStyle = '#404040'; ctx.font = '13px monospace';
    ctx.fillText('v1.0 — HTML5 Canvas 版', cx, H - 20);
    ctx.textAlign = 'start';
  }

  _drawPause() {
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 42px monospace';
    ctx.fillText('游戏暂停', W/2, H/2 - 30);
    ctx.fillStyle = '#808080'; ctx.font = '20px monospace';
    ctx.fillText('ESC 继续    Q 退出', W/2, H/2 + 20);
    ctx.textAlign = 'start';
  }

  _drawDeath() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#dc3232'; ctx.font = 'bold 50px monospace';
    ctx.fillText('你死了', W/2, H/2 - 50);
    ctx.fillStyle = '#fff'; ctx.font = '24px monospace';
    ctx.fillText(`到达: 第 ${this.floorNum} 层`, W/2, H/2);
    ctx.fillStyle = '#dcdc32'; ctx.font = '24px monospace';
    ctx.fillText(`得分: ${this.player.score}`, W/2, H/2 + 30);
    if (Math.floor(Date.now()/500) % 2 === 0) {
      ctx.fillStyle = '#fff'; ctx.font = '22px monospace';
      ctx.fillText('按 SPACE 重新开始', W/2, H/2 + 80);
    }
    ctx.fillStyle = '#808080'; ctx.font = '18px monospace';
    ctx.fillText('按 Q 返回标题', W/2, H/2 + 110);
    ctx.textAlign = 'start';
  }

  _drawFloorTransition() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 50px monospace';
    ctx.fillText(`第 ${this.floorNum} 层`, W/2, H/2);
    ctx.fillStyle = '#808080'; ctx.font = '20px monospace';
    ctx.fillText('准备进入...', W/2, H/2 + 50);
    ctx.textAlign = 'start';
  }

  handleEvents() {
    const k = consumeKey;
    if (this.state === 'TITLE') {
      if (k(' ')) { this.state = 'PLAYING'; this.newGame(); }
    } else if (this.state === 'PLAYING') {
      if (k('escape')) this.state = 'PAUSED';
      if (k('1')) this.player.weapon = new Weapon('pistol');
      if (k('2')) this.player.weapon = new Weapon('rifle');
      if (k('3')) this.player.weapon = new Weapon('shotgun');
      if (k('4')) this.player.weapon = new Weapon('laser');
      if (k('5')) this.player.weapon = new Weapon('sword');
    } else if (this.state === 'PAUSED') {
      if (k('escape')) this.state = 'PLAYING';
      if (k('q')) this.state = 'TITLE';
    } else if (this.state === 'DEAD') {
      if (k(' ')) { this.state = 'PLAYING'; this.newGame(); }
      if (k('q')) this.state = 'TITLE';
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════
initSprites();
const game = new Game();

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - game.lastTime) / 1000, 0.1);
  game.lastTime = timestamp;
  game.handleEvents();
  game.update(dt);
  game.draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
console.log('⚔️ 元气地牢 Soul Dungeon — Ready!');
console.log('  WASD 移动 | 鼠标瞄准 | 左键射击 | 右键技能');
console.log('  1-5 切换武器 | R 换弹 | ESC 暂停');
</script>
